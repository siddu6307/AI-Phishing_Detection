{% extends "base.html" %}
{% block title %}Sign up · Phishing Checker{% endblock %}
{% block content %}
<div class="card">
  <h1>Create account</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Email <input type="email" name="email" required autofocus></label>
    <label>Password (8+ characters) <input type="password" name="password" minlength="8" required></label>
    <label>Confirm password <input type="password" name="confirm" minlength="8" required></label>
    <button class="btn">Sign up</button>
  </form>
  <p class="alt">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
